<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetCo — Company Insights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-orange: #ff8c00;
      --deep-black: #0a0a0a;
      --card-bg: #151515;
      --border-color: #2a2a2a;
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      padding: 20px;
      font-family: 'Poppins', sans-serif;
      background-color: black;
      color: var(--text-main);
      overflow: hidden;
    }

    /* Header Section */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      width: 44px;
      height: 44px;
      background: var(--primary-orange);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      /* Animation removed as per request */
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .title-container h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.2px;
    }

    .title-container .tagline {
      font-size: 11px;
      color: var(--primary-orange);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 2px;
    }

    /* Status Card */
    .status-container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 24px;
      transition: border-color 0.3s ease;
    }

    .status-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .status-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-icon svg {
      width: 18px;
      height: 18px;
    }

    .status-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-main);
      font-weight: 400;
    }

    /* Status States */
    .status-container.success { border-left: 3px solid #22c55e; }
    .status-container.warning { border-left: 3px solid var(--primary-orange); }
    .status-container.error { border-left: 3px solid #ef4444; }

    /* Footer Section */
    .footer {
      text-align: center;
      padding-top: 10px;
    }

    .footer-text {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .footer-highlight {
      color: var(--primary-orange);
      font-weight: 600;
    }

    /* Premium Loader */
    .loader {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 140, 0, 0.1);
      border-top: 2px solid var(--primary-orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Animation for content entry */
    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="fade-in">
  <div class="header">
    <div class="logo">
      <img src="icons/icon48.png" alt="L">  
    </div>
    <div class="title-container">
      <h1>LeetCo</h1>
      <div class="tagline">Interview Mastery</div>
    </div>
  </div>

  <div id="status" class="status-container warning">
    <div class="status-header">
      <div class="status-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>
      <div class="status-title">System Status</div>
    </div>
    <div id="statusText" class="status-text">
      <div class="loader">
        <div class="spinner"></div>
        <span>Establishing connection...</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-text">
      <span class="footer-highlight">LeetCo</span> is active. We are analyzing company<br>
      patterns for your current problem.
    </div>
  </div>

  <script src="popup.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const statusContainer = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      const iconContainer = statusContainer.querySelector('.status-icon');

      function updateStatus(status, message) {
        statusContainer.classList.remove('success', 'warning', 'error');
        statusContainer.classList.add(status);
        
        statusText.style.opacity = '0';
        setTimeout(() => {
          statusText.innerHTML = message;
          statusText.style.opacity = '1';
          statusText.style.transition = 'opacity 0.2s ease';
        }, 100);
        
        // Update SVG Icons based on status
        if (status === 'success') {
          iconContainer.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
        } else if (status === 'error') {
          iconContainer.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
        }
      }

      // Simulate connection
      setTimeout(() => {
        updateStatus('success', 'Connected to LeetCode. Dashboard synced and ready.');
      }, 1500);

      // Real check
      if (typeof chrome !== 'undefined' && chrome.runtime) {
        chrome.runtime.sendMessage({ type: 'PING_EXTENSION' }, (response) => {
          if (chrome.runtime.lastError) {
            updateStatus('error', 'Extension service unavailable. Please reload LeetCode.');
          } else if (response && response.status === 'READY') {
            updateStatus('success', 'LeetCo Engine is active and ready.');
          }
        });
      }
    });
  </script>
</body>
</html>
